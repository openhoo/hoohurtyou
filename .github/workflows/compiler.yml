name: Compiler and native desktop
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: hoo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config libgtk-3-dev xvfb
      - name: Generated sources remain reproducible
        run: |
          python tools/generate_examples.py
          git diff --exit-code -- examples
      - name: Compiler and runtime with sanitizers
        env:
          hoo: '1'
        run: python -m unittest discover -s tests -v
      - name: Linux native desktop controls
        if: runner.os == 'Linux'
        env:
          hoo: '1'
          hooo: '1'
        run: |
          xvfb-run -a python -m unittest discover -s tests -p test_language.py -k desktop_controls -v
          xvfb-run -a python -m unittest discover -s tests -p test_language.py -k canvas -v
          xvfb-run -a python -m unittest discover -s tests -p test_modules.py -k modular_desktop_callbacks -v
      - name: macOS native desktop controls and bundle
        if: runner.os == 'macOS'
        env:
          hooo: '1'
        run: |
          python -m unittest discover -s tests -p test_language.py -k desktop_controls -v
          python -m unittest discover -s tests -p test_language.py -k canvas -v
          python -m unittest discover -s tests -p test_modules.py -k modular_desktop_callbacks -v
          ./bin/hoo hoooooo examples/counter.hoo --hoooooo build/HooCounter.app --hooooooo
          ./bin/hoo hoooooo examples/notepad.hoo --hoooooo build/HooNotes.app --hooooooo
          ./bin/hoo hoooooo examples/editor.hoo --hoooooo build/HooEditor.app --hooooooo
          ./bin/hoo hoooooo examples/hoo/hoo.hoo --hoooooo build/HooModules.app --hooooooo
          ./bin/hoo hoooooo examples/snake.hoo --hoooooo build/HooSnake.app --hooooooo
      - name: Linux desktop executables
        if: runner.os == 'Linux'
        run: |
          ./bin/hoo hoooooo examples/counter.hoo --hoooooo build/hoo-counter
          ./bin/hoo hoooooo examples/notepad.hoo --hoooooo build/hoo-notes
          ./bin/hoo hoooooo examples/editor.hoo --hoooooo build/hoo-editor
          ./bin/hoo hoooooo examples/hoo/hoo.hoo --hoooooo build/hoo-modules
          ./bin/hoo hoooooo examples/snake.hoo --hoooooo build/hoo-snake
      - name: Fresh installation includes native runtime
        run: |
          python -m venv /tmp/hoo-install
          /tmp/hoo-install/bin/pip install .
          /tmp/hoo-install/bin/hoo hoooooo examples/hello.hoo --hoooo --hoooooo /tmp/hoo-installed-hello
          test ! -e /tmp/hoo-install/bin/hooc
          /tmp/hoo-installed-hello
          /tmp/hoo-install/bin/hoo hooooooo examples/hoo/hooooo.hoo --hoooo
      - name: Desktop application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hoo-desktop-${{ runner.os }}-${{ runner.arch }}
          path: build/
          retention-days: 14
